<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Studio Wallpapers</title>
<style>
  /* Named faces pin the UI to Segoe UI by its full and PostScript names, so a family-name
     mismatch can't fall through to the system font. */
  @font-face { font-family: "Studio Segoe"; font-weight: 400; src: local("Segoe UI"), local("SegoeUI"); }
  @font-face { font-family: "Studio Segoe"; font-weight: 600 700; src: local("Segoe UI Semibold"), local("SegoeUI-Semibold"), local("Segoe UI Bold"), local("SegoeUI-Bold"); }
  :root {
    --bg: #0b0d0b;
    --panel: #141714;
    --line: #2a302a;
    --text: #e6ebe6;
    --muted: #8a948a;
    --accent: #7fd321;
    font: 13px/1.4 "Studio Segoe", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { display: grid; grid-template-columns: 300px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 12px; letter-spacing: .02em; }
  fieldset { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 12px 0 4px; }
  legend { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 0 0 6px; }
  label { display: grid; grid-template-columns: 90px 1fr 54px; align-items: center; gap: 8px; margin: 0 0 8px; }
  label.wide { grid-template-columns: 90px 1fr; }
  input.num { width: 100%; min-width: 0; background: #0b0d0b; color: var(--text); border: 1px solid var(--line); padding: 2px 4px; font: inherit; text-align: right; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
  input.num::-webkit-inner-spin-button, input.num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=number], select { width: 100%; background: #0b0d0b; color: var(--text); border: 1px solid var(--line); padding: 4px 6px; font: inherit; }
  input[type=color] { width: 100%; height: 26px; background: none; border: 1px solid var(--line); padding: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
  button { background: #1d221d; color: var(--text); border: 1px solid var(--line); padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #071007; border-color: var(--accent); font-weight: 600; }
  .swatch { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); }
  main { position: relative; display: grid; place-items: center; padding: 24px; overflow: hidden; }
  #stage { position: relative; max-width: 100%; max-height: 100%; }
  #preview { display: block; width: 100%; height: auto; }
  .bezel { position: absolute; top: 0; bottom: 0; background: var(--bg); }
  .bezel--h { top: auto; bottom: auto; left: 0; right: 0; }
  .hint { position: absolute; left: 24px; bottom: 12px; color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 45vh auto; } main { order: -1; } }
</style>
<link rel="stylesheet" href="overlay.css?v=2">
</head>
<body>
<aside>
  <h1>Studio Wallpapers</h1>

  <fieldset>
    <legend>Displays</legend>
    <label class="wide">Resolution
      <select id="res">
        <option value="1920x1080">1920 × 1080</option>
        <option value="2560x1440">2560 × 1440</option>
        <option value="3840x2160" selected>3840 × 2160 (4K)</option>
        <option value="3440x1440">3440 × 1440 (ultrawide)</option>
        <option value="5120x1440">5120 × 1440 (super ultrawide)</option>
        <option value="2880x1800">2880 × 1800 (laptop)</option>
        <option value="1080x1920">1080 × 1920 (portrait)</option>
        <option value="custom">Custom…</option>
      </select>
    </label>
    <div class="row" id="customRes" hidden>
      <input type="number" id="w" min="320" max="16384" value="3840" aria-label="Width">
      <input type="number" id="h" min="320" max="16384" value="2160" aria-label="Height">
    </div>
    <label>Columns <input type="range" id="cols" min="1" max="6" value="1"><output></output></label>
    <label>Rows <input type="range" id="rows" min="1" max="4" value="1"><output></output></label>
    <label>Bezel gap <input type="range" id="gap" min="0" max="200" value="40"><output></output></label>
    <p class="note">Gap is the physical bezel in pixels. The art runs behind it, so swooshes line up across screens.</p>
  </fieldset>

  <fieldset>
    <legend>Colour</legend>
    <label class="wide">Accent <input type="color" id="accent" value="#107c10"></label>
    <div class="row" id="swatches"></div>
    <label>Background <input type="range" id="bgGlow" min="0" max="100" value="95"><output></output></label>
    <label>Edge hue <input type="range" id="shift" min="-90" max="90" value="30"><output></output></label>
    <label>Whites <input type="range" id="whites" min="0" max="100" value="85"><output></output></label>
  </fieldset>

  <fieldset>
    <legend>Shape</legend>
    <label>Busyness <input type="range" id="busy" min="0" max="100" value="10"><output></output></label>
    <label>Fill <input type="range" id="fill" min="0" max="100" value="67"><output></output></label>
    <label>Angle <input type="range" id="angle" min="-60" max="60" value="35"><output></output></label>
    <label>Spread <input type="range" id="spread" min="0" max="100" value="50"><output></output></label>
    <label>Curl <input type="range" id="curl" min="0" max="100" value="55"><output></output></label>
    <label>Chaos <input type="range" id="chaos" min="0" max="100" value="70"><output></output></label>
    <label>Twist <input type="range" id="twist" min="0" max="100" value="25"><output></output></label>
    <label>Bloom <input type="range" id="glow" min="0" max="100" value="22"><output></output></label>
    <label>Pixel bits <input type="range" id="bits" min="0" max="100" value="25"><output></output></label>
    <label>Grain <input type="range" id="grain" min="0" max="100" value="0"><output></output></label>
  </fieldset>

  <fieldset>
    <legend>Seed</legend>
    <label class="wide">Seed <input type="number" id="seed" min="0" max="999999999"></label>
    <div class="row">
      <button id="reseed" title="Space">New seed</button>
      <button id="shuffle" title="S">Shuffle all</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Export</legend>
    <div class="row">
      <button class="primary" id="exportSpan">Download span PNG</button>
      <button id="exportEach">One PNG per monitor</button>
    </div>
    <p class="note" id="exportInfo"></p>
  </fieldset>

  <fieldset id="overlayPanel">
    <legend>Labels</legend>
  </fieldset>
</aside>

<main>
  <div id="stage"><canvas id="preview"></canvas></div>
  <div class="hint">Space: new seed · S: shuffle · the URL keeps your settings</div>
</main>

<script src="overlay.js?v=2"></script>
<script>
"use strict";

const PALETTES = ["#7fd321", "#107c10", "#3ad16b", "#c8ff3d", "#2fd6b0", "#e8e8e8", "#38a8ff", "#ff5a36"];
const $ = (id) => document.getElementById(id);
const ctrlIds = ["cols", "rows", "gap", "accent", "bgGlow", "whites", "busy", "fill", "angle", "spread", "curl", "chaos", "twist", "shift", "glow", "bits", "grain", "seed"];

// ---------- helpers ----------

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s * 100, l * 100];
}

const hsla = (h, s, l, a = 1) => `hsla(${h.toFixed(1)},${s.toFixed(1)}%,${l.toFixed(1)}%,${a.toFixed(3)})`;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// ---------- settings ----------

function readSettings() {
  const [rw, rh] = $("res").value === "custom" ? [+$("w").value, +$("h").value] : $("res").value.split("x").map(Number);
  const p = { w: clamp(rw || 1920, 320, 16384), h: clamp(rh || 1080, 320, 16384), res: $("res").value };
  for (const id of ctrlIds) p[id] = id === "accent" ? $(id).value : +$(id).value;
  return p;
}

function layout(p) {
  const cols = p.cols, rows = p.rows, gap = p.gap, screens = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++) screens.push({ x: c * (p.w + gap), y: r * (p.h + gap), w: p.w, h: p.h, col: c, row: r });
  return { W: cols * p.w + (cols - 1) * gap, H: rows * p.h + (rows - 1) * gap, cols, rows, screens };
}

// ---------- the generator ----------
// Everything is laid out in virtual-canvas units (the full span incl. bezels), with sizes relative to H,
// so a preview and a full-size export of the same settings draw the same picture.

// |x| with the corner at 0 rounded off; true |x| puts a visible kink in the ribbon edge.
const sabs = (x, k = 0.25) => (Math.sqrt(x * x + k * k) - k) / (Math.sqrt(1 + k * k) - k);

function buildScene(p, W, H, px) {
  const rnd = mulberry32(p.seed);
  const r = (a = 0, b = 1) => lerp(a, b, rnd());
  const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
  const busy = p.busy / 100, spread = p.spread / 100, curl = p.curl / 100, chaos = p.chaos / 100, whites = p.whites / 100, twist = p.twist / 100;

  const ang = (p.angle * Math.PI) / 180;
  // Wide spans flatten the slope and add ribbons, so the swoosh crosses every screen.
  const aspect = Math.max(1, W / H / (16 / 9));
  const dl = Math.hypot(Math.cos(ang) * aspect, Math.sin(ang));
  const d = [(Math.cos(ang) * aspect) / dl, -Math.sin(ang) / dl];
  const nrm = [-d[1], d[0]];
  const focal = [W * r(0.4, 0.6), H * r(0.45, 0.6)];
  const L = Math.hypot(W, H) * 0.75;

  const count = Math.round(lerp(3, 10, busy) * Math.sqrt(aspect));
  // Shared shape values keep neighbours parallel; Chaos adds per-ribbon jitter on top.
  const sideBias = [r(-0.5, 0.5), r(-0.5, 0.5)];
  const cross = rnd() < 0.65 ? -1 : 1; // -1 flips the fan through the focal point, so the ribbons cross there
  const bowDir = r(-1, 1);
  const kShared = r(1.6, 2.6);
  const fanW = lerp(0.12, 1.1, spread);
  const ribbons = [];

  for (let i = 0; i < count; i++) {
    const fan = count > 1 ? (i / (count - 1)) * 2 - 1 : 0;
    const jit = () => gauss() * chaos;
    const offF = (fan * 0.16 * fanW + jit() * 0.08) * H;
    const offL = (sideBias[0] + fan * fanW + jit() * 0.5) * H;
    const offR = (sideBias[1] + cross * fan * fanW + jit() * 0.5) * H;
    const k = Math.max(1.6, kShared + jit() * 0.6); // below ~1.5 |t|^k has a visible corner at the crossing
    const bow = (bowDir * 0.8 + jit() * 0.5) * H * lerp(0.02, 0.4, curl);
    const curlAmp = curl * chaos * H * r(-0.3, 0.3);
    const curlFreq = r(0.6, 1.6), curlPh = r(0, Math.PI * 2);

    const wide = rnd() < 0.3;
    const wmax = H * (wide ? r(0.22, 0.4) : r(0.08, 0.18));
    const grow = rnd() < 0.5 ? 1 : -1;
    const ge = r(0.5, 1.4);
    const pinch = r(0.45, 0.8);
    // Twist turns the ribbon about its spine; |cos| is the visible width, the sign picks front or back face.
    const tw = { freq: lerp(0, 1.1, twist) * r(0.6, 1.2), ph: r(0, Math.PI * 2) };

    // Slices about 3 device px long; coarser ones show as facets and corners in the rims.
    const N = Math.round(clamp((2 * L * px) / 3, 200, 4000));
    const center = [], width = [], phase = [], edgeF = [];
    const refl = { freq: r(0.8, 2.4), ph: r(0, Math.PI * 2) };
    for (let j = 0; j <= N; j++) {
      const t = (j / N) * 2 - 1;
      const side = t < 0 ? offL : offR;
      const perp = offF + side * Math.pow(Math.abs(t), k) + bow * (1 - t * t) + curlAmp * Math.sin(Math.PI * t * curlFreq + curlPh) * (1 - t * t * 0.5);
      const along = t * L;
      center.push([focal[0] + d[0] * along + nrm[0] * perp, focal[1] + d[1] * along + nrm[1] * perp]);
      const u = grow > 0 ? (t + 1) / 2 : (1 - t) / 2;
      const ph = Math.PI * tw.freq * t + tw.ph;
      phase.push(ph);
      // Seen at angle ph, a strip of face width wf and thickness T spans wf|cos| + T|sin|; the T part is
      // its side wall, drawn as a lit edge so a twist reads as a turn and not a pinch.
      const wf = wmax * (0.35 + 0.65 * Math.pow(u, ge)) * (pinch + (1 - pinch) * Math.pow(t * t + 0.004, 0.35));
      const sn = Math.sin(ph), T = wf * 0.18, wall = T * Math.sign(sn) * sabs(sn);
      const vis = wf * sabs(Math.cos(ph)) + Math.abs(wall);
      width.push(vis);
      edgeF.push(wall / vis);
    }

    ribbons.push({
      center, width, phase, edgeF, refl, wide,
      white: rnd() < whites * 0.3,
      fadeA: r(0, 0.4), fadeB: r(0, 0.4),
      layer: r(0, 1),
    });
  }
  ribbons.sort((a, b) => a.layer - b.layer);

  const trails = [];
  const trailCount = Math.round(Math.pow(p.bits / 100, 1.4) * 60);
  for (let i = 0; i < trailCount && ribbons.length; i++) {
    const host = ribbons[Math.floor(rnd() * ribbons.length)];
    const start = r(0.05, 0.85), len = r(0.06, 0.16), side = rnd() < 0.5 ? 1 : -1;
    const n = Math.round(r(8, 30)), size0 = H * r(0.004, 0.011);
    const squares = [];
    for (let s = 0; s < n; s++) {
      if (rnd() < 0.15) continue;
      squares.push({ t: start + (s / n) * len, size: size0 * lerp(1, 0.35, s / n) * r(0.6, 1.2), off: side * H * r(0.06, 0.1), tone: rnd() });
    }
    trails.push({ host, squares });
  }

  return { focal, ribbons, trails, rnd };
}

function outline(rb) {
  const c = rb.center, w = rb.width, top = [], bot = [];
  for (let j = 0; j < c.length; j++) {
    const a = c[Math.max(0, j - 1)], b = c[Math.min(c.length - 1, j + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const hw = w[j] / 2;
    top.push([c[j][0] - ty * hw, c[j][1] + tx * hw]);
    bot.push([c[j][0] + ty * hw, c[j][1] - tx * hw]);
  }
  return { top, bot };
}

const smooth = (x) => x * x * (3 - 2 * x);
// Fade along the ribbon, so ends dissolve into the dark instead of stopping at the frame.
const envelope = (rb, u) => (u < 0.5 ? lerp(rb.fadeA, 1, smooth(u * 2)) : lerp(1, rb.fadeB, smooth(u * 2 - 1)));

// Wide soft glow without ctx.filter (Safari lacks it): halve the frame one step at a time, add each
// smaller level back onto the next larger one, then scale up 2x at a time. Bigger single jumps
// skip pixels on the way down and stretch them into blocks on the way up.
function bloom(ctx, amount) {
  const src = ctx.canvas;
  if (!src.width || !src.height) return;
  const make = (w, h) => {
    const c = document.createElement("canvas");
    c.width = Math.max(1, w); c.height = Math.max(1, h);
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    return c;
  };
  const levels = [src];
  while (levels.length < 9) {
    const p = levels[levels.length - 1];
    if (p.width < 4 || p.height < 4) break;
    const c = make(Math.ceil(p.width / 2), Math.ceil(p.height / 2));
    c.getContext("2d").drawImage(p, 0, 0, c.width, c.height);
    levels.push(c);
  }
  // Levels finer than 1/8 are left out: they keep the lines sharp, and sharp lines blown up show as blocks.
  const base = Math.min(3, levels.length - 1);
  for (let i = levels.length - 2; i >= base; i--) {
    const g = levels[i].getContext("2d");
    g.globalCompositeOperation = "lighter";
    g.globalAlpha = 0.8;
    g.drawImage(levels[i + 1], 0, 0, levels[i].width, levels[i].height);
  }
  let up = levels[base];
  for (let i = base - 1; i >= 1; i--) {
    const c = make(levels[i].width, levels[i].height);
    c.getContext("2d").drawImage(up, 0, 0, c.width, c.height);
    up = c;
  }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.globalCompositeOperation = "screen";
  ctx.globalAlpha = Math.min(1, amount * 0.45);
  ctx.drawImage(up, 0, 0, src.width, src.height);
  ctx.restore();
}

// Thick glass, drawn slice by slice into `lctx` (a scratch layer). Each slice has its own cross-width
// gradient: a hot bevel on both walls, a dark tinted core, and an inner sheen that slides across as the
// ribbon twists. Slices share exact vertices and are added together, so their antialiased edges sum to
// full coverage and leave no seams; the finished layer is then laid over the scene opaquely.
function drawGlass(lctx, rb, o, pal, fill) {
  const { top, bot } = o, n = top.length - 1;
  const body = lerp(0.35, 0.9, fill) * (rb.wide ? 0.75 : 1);
  for (let j = 0; j < n; j++) {
    const e = envelope(rb, j / n);
    if (e < 0.01) continue;
    const ph = rb.phase[j], front = Math.cos(ph) >= 0;
    // Back faces are darker and swap which wall catches the light.
    const lit = front ? 1 : 0.7;
    const [a, b] = front ? [top[j], bot[j]] : [bot[j], top[j]];
    const ea = e * body;
    // Soft patches along the length where the face mirrors a bright studio light.
    const mirror = Math.pow(Math.max(0, Math.sin(Math.PI * 2 * rb.refl.freq * (j / n) + rb.refl.ph)), 6) * lit * e;
    // Each band keeps to its own lane: when two stops pass each other the gradient reorders and
    // the colour jumps, which shows as a hard seam across the ribbon.
    const hl = 0.62 + 0.18 * Math.sin(ph);
    const hl2 = 0.22 + 0.05 * Math.sin(ph * 1.7);
    const face = [
      [0, pal.rimHot(e * lit)], [0.012, pal.rim(0.95 * e * lit)], [0.05, pal.rim(0.7 * e * lit)],
      [0.1, pal.core(0.9 * ea, 0.75)],
      [hl2 - 0.06, pal.core(0.85 * ea, 1)], [hl2, pal.refl(0.15 + 0.75 * mirror)], [hl2 + 0.07, pal.core(0.85 * ea, 1)],
      [Math.max(hl2 + 0.1, hl - 0.16), pal.core(0.85 * ea, 1)], [hl, pal.sheen((0.7 + 0.3 * mirror) * ea * lit)],
      [Math.min(0.86, hl + 0.2), pal.core(0.85 * ea, 0.9)],
      [0.9, pal.core(0.9 * ea, 1.3)], [0.96, pal.refract(0.85 * e * lit)], [1, pal.refractHot(e * lit)],
    ];
    // Side wall takes fraction |f| of the visible width, at the a end for f > 0.
    const f = rb.edgeF[j] * (front ? 1 : -1), af = Math.min(1, Math.abs(f));
    const g = lctx.createLinearGradient(a[0], a[1], b[0], b[1]);
    const map = f > 0 ? (u) => af + u * (1 - af) : (u) => u * (1 - af);
    const addFace = () => { for (const [u, c] of face) g.addColorStop(clamp(map(u), 0, 1), c); };
    // Stops at equal offsets keep insertion order, so add whichever part comes first across the ribbon first.
    if (f <= 0) addFace();
    if (af > 0.01) {
      const wall = [[0, pal.rimHot(e)], [0.5, pal.wall(0.9 * e)], [1, pal.rimHot(0.85 * e)]];
      for (const [u, c] of wall) g.addColorStop(f > 0 ? u * af : 1 - u * af, c); // u = 0 is the outer edge
    }
    if (f > 0) addFace();
    lctx.fillStyle = g;
    lctx.beginPath();
    lctx.moveTo(top[j][0], top[j][1]); lctx.lineTo(top[j + 1][0], top[j + 1][1]);
    lctx.lineTo(bot[j + 1][0], bot[j + 1][1]); lctx.lineTo(bot[j][0], bot[j][1]);
    lctx.closePath();
    lctx.fill();
  }
}

// Specular hairline on the lit wall, brightest where that face turns toward the viewer.
function drawSpecular(ctx, rb, o, pal, H, px) {
  const n = rb.center.length - 1;
  ctx.lineWidth = Math.max(H * 0.0011, 1 / px);
  ctx.lineCap = "butt"; // round caps would double up at every segment joint
  for (let j = 0; j < n; j++) {
    const ph = rb.phase[j], c = Math.cos(ph);
    const s = envelope(rb, j / n) * Math.pow(Math.abs(c), 3) * (0.35 + 0.65 * Math.max(0, Math.sin(ph + 0.8)));
    if (s < 0.03) continue;
    const pts = c >= 0 ? o.top : o.bot;
    ctx.strokeStyle = pal.spec(s);
    ctx.beginPath(); ctx.moveTo(pts[j][0], pts[j][1]); ctx.lineTo(pts[j + 1][0], pts[j + 1][1]); ctx.stroke();
  }
}

function palette(p, rb) {
  const [hue, S] = hexToHsl(p.accent);
  const h2 = hue + p.shift;
  if (rb.white) {
    return {
      rimHot: (a) => hsla(hue, 10, 96, a), rim: (a) => hsla(hue, 12, 80, a),
      core: (a, k) => hsla(hue, 8, 10 * k, a), sheen: (a) => hsla(hue, 10, 42, a),
      refract: (a) => hsla(h2, S * 0.6, 55, a), refractHot: (a) => hsla(h2, S * 0.5, 75, a),
      spec: (a) => `rgba(255,255,255,${a.toFixed(3)})`,
      refl: (a) => `rgba(245,248,250,${a.toFixed(3)})`, wall: (a) => hsla(hue, 10, 70, a),
    };
  }
  return {
    rimHot: (a) => hsla(hue, S, 80, a), rim: (a) => hsla(hue, Math.min(100, S * 1.1), 52, a),
    core: (a, k) => hsla(hue, S, 12 * k, a), sheen: (a) => hsla(hue, S, 40, a),
    refract: (a) => hsla(h2, S, 48, a), refractHot: (a) => hsla(h2, S, 70, a),
    spec: (a) => `rgba(255,255,248,${a.toFixed(3)})`,
    refl: (a) => hsla(hue, S * 0.3, 92, a), wall: (a) => hsla(hue, S, 45, a),
  };
}

// `px` is device pixels per virtual unit, for hairlines that must stay at least one device pixel.
function render(ctx, p, W, H, px) {
  const [hue, S] = hexToHsl(p.accent);
  const glow = p.glow / 100, fill = p.fill / 100;
  const scene = buildScene(p, W, H, px);
  const { focal } = scene;

  ctx.save();
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  const bg = p.bgGlow / 100;
  let g = ctx.createRadialGradient(focal[0], focal[1], 0, focal[0], focal[1], Math.max(W, H) * 0.8);
  g.addColorStop(0, hsla(hue, S * 0.8, 16, 0.85 * bg));
  g.addColorStop(0.5, hsla(hue, S * 0.8, 7, 0.45 * bg));
  g.addColorStop(1, hsla(hue, S * 0.8, 2, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "rgba(0,0,0,0.35)");
  g.addColorStop(0.6, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const layer = document.createElement("canvas");
  layer.width = ctx.canvas.width; layer.height = ctx.canvas.height;
  const lctx = layer.getContext("2d");
  lctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  for (const rb of scene.ribbons) {
    const o = outline(rb), pal = palette(p, rb);
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.clearRect(0, 0, layer.width, layer.height);
    lctx.setTransform(ctx.getTransform());
    drawGlass(lctx, rb, o, pal, fill);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(layer, 0, 0);
    ctx.restore();
    ctx.globalCompositeOperation = "lighter";
    drawSpecular(ctx, rb, o, pal, H, px);
  }

  ctx.globalCompositeOperation = "source-over";
  for (const tr of scene.trails) {
    const c = tr.host.center;
    for (const sq of tr.squares) {
      const idx = Math.min(c.length - 2, Math.floor(sq.t * (c.length - 1)));
      const a = c[idx], b = c[idx + 1];
      const m = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const x = a[0] - ((b[1] - a[1]) / m) * sq.off, y = a[1] + ((b[0] - a[0]) / m) * sq.off;
      ctx.fillStyle = sq.tone < 0.4 ? hsla(hue, S, 55) : sq.tone < 0.7 ? "#f4f4f4" : sq.tone < 0.85 ? hsla(hue, S, 75) : "#000";
      ctx.fillRect(x - sq.size / 2, y - sq.size / 2, sq.size, sq.size);
    }
  }

  if (glow > 0) bloom(ctx, glow);

  g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.5)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // Grain is drawn in device pixels so it stays fine at any output size.
  if (p.grain > 0) {
    const tile = document.createElement("canvas");
    tile.width = tile.height = 256;
    const tctx = tile.getContext("2d");
    const img = tctx.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = scene.rnd() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    tctx.putImageData(img, 0, 0);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "overlay";
    ctx.globalAlpha = (p.grain / 100) * 0.35;
    ctx.fillStyle = ctx.createPattern(tile, "repeat");
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.restore();
  }
}

// ---------- preview ----------

const preview = $("preview"), stage = $("stage");
let queued = false;

function drawPreview() {
  queued = false;
  const p = readSettings();
  const { W, H, screens } = layout(p);
  const box = stage.parentElement.getBoundingClientRect();
  const fit = Math.min((box.width - 48) / W, (box.height - 48) / H);
  const cssW = W * fit, cssH = H * fit, dpr = window.devicePixelRatio || 1;
  preview.width = Math.round(cssW * dpr);
  preview.height = Math.round(cssH * dpr);
  stage.style.width = cssW + "px";
  const ctx = preview.getContext("2d");
  const px = fit * dpr;
  ctx.setTransform(px, 0, 0, px, 0, 0);
  render(ctx, p, W, H, px);
  ctx.setTransform(px, 0, 0, px, 0, 0);
  window.StudioOverlay?.draw(ctx, screens);

  stage.querySelectorAll(".bezel").forEach((el) => el.remove());
  const bw = Math.max(2, p.gap * fit) + "px";
  for (let c = 1; c < p.cols; c++) {
    const el = document.createElement("div");
    el.className = "bezel";
    el.style.left = (c * (p.w + p.gap) - p.gap) * fit + "px";
    el.style.width = bw;
    stage.appendChild(el);
  }
  for (let r = 1; r < p.rows; r++) {
    const el = document.createElement("div");
    el.className = "bezel bezel--h";
    el.style.top = (r * (p.h + p.gap) - p.gap) * fit + "px";
    el.style.height = bw;
    stage.appendChild(el);
  }

  const n = screens.length, mp = ((p.w * p.h * n) / 1e6).toFixed(1);
  $("exportInfo").textContent = `${p.cols}×${p.rows} grid of ${p.w}×${p.h} · span ${p.w * p.cols}×${p.h * p.rows} (${mp} MP)`;
  syncNumbers();
  document.documentElement.style.setProperty("--accent", p.accent);
  history.replaceState(null, "", "#" + new URLSearchParams(Object.entries(p)).toString());
}

// Each slider's <output> becomes a typable field. data-scale shows 0–1 sliders in percent.
const scaleOf = (r) => +(r.dataset.scale || 1);
function showNumber(n) {
  const k = scaleOf(n._range);
  n.value = +(+n._range.value * k).toFixed(k === 100 ? 1 : 2);
}
function syncNumbers() {
  document.querySelectorAll("input.num").forEach((n) => { if (document.activeElement !== n) showNumber(n); });
}
function numberFields(root) {
  root.querySelectorAll("label > input[type=range]").forEach((r) => {
    const out = r.nextElementSibling;
    if (!out || out.tagName !== "OUTPUT") return;
    const k = scaleOf(r), n = document.createElement("input");
    n.type = "number"; n.className = "num";
    n.min = r.min * k; n.max = r.max * k; n.step = (+r.step || 1) * k;
    n.setAttribute("aria-label", r.parentElement.firstChild.textContent.trim() + (k === 100 ? " (%)" : ""));
    n._range = r;
    n.addEventListener("input", () => {
      if (n.value === "" || !isFinite(+n.value)) return;
      r.value = clamp(+n.value / k, +r.min, +r.max);
      r.dispatchEvent(new Event("input", { bubbles: true }));
    });
    // On Enter or blur, snap the field to what the slider accepted (clamped and stepped).
    n.addEventListener("change", () => showNumber(n));
    n.addEventListener("keydown", (e) => { if (e.key === "Enter") showNumber(n); });
    r.addEventListener("input", () => { if (document.activeElement !== n) showNumber(n); });
    out.replaceWith(n);
    showNumber(n);
  });
}

function schedule() { if (!queued) { queued = true; requestAnimationFrame(drawPreview); } }

// ---------- export ----------

function renderFull(p) {
  const { W, H, screens } = layout(p);
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const cctx = c.getContext("2d");
  render(cctx, p, W, H, 1);
  cctx.setTransform(1, 0, 0, 1, 0, 0);
  window.StudioOverlay?.draw(cctx, screens);
  return { c, screens };
}

function download(canvas, name) {
  return new Promise((done) => canvas.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); done(); }, 500);
  }, "image/png"));
}

function crop(src, s) {
  const c = document.createElement("canvas");
  c.width = s.w; c.height = s.h;
  c.getContext("2d").drawImage(src, s.x, s.y, s.w, s.h, 0, 0, s.w, s.h);
  return c;
}

async function exportPNG(each) {
  const p = readSettings();
  const btns = [$("exportSpan"), $("exportEach")];
  btns.forEach((b) => (b.disabled = true));
  $("exportInfo").textContent = "Rendering…";
  await new Promise((r) => setTimeout(r, 30));
  try {
    const { c, screens } = renderFull(p);
    const base = `studio-${p.seed}-${p.w}x${p.h}`;
    if (each || screens.length === 1) {
      for (const s of screens) await download(crop(c, s), screens.length > 1 ? `${base}-r${s.row + 1}c${s.col + 1}.png` : `${base}.png`);
    } else {
      // Span file for OS "span" mode: screens butted together, bezel strips cut out.
      const span = document.createElement("canvas");
      span.width = p.w * p.cols; span.height = p.h * p.rows;
      const sctx = span.getContext("2d");
      for (const s of screens) sctx.drawImage(c, s.x, s.y, s.w, s.h, s.col * p.w, s.row * p.h, s.w, s.h);
      await download(span, `${base}-${p.cols}x${p.rows}.png`);
    }
  } finally {
    btns.forEach((b) => (b.disabled = false));
    schedule();
  }
}

// ---------- wiring ----------

function newSeed() { $("seed").value = Math.floor(Math.random() * 1e9); schedule(); }

function shuffle() {
  for (const id of ["busy", "fill", "spread", "curl", "chaos", "twist", "glow", "whites", "bgGlow"]) $(id).value = Math.round(Math.random() * 100);
  $("angle").value = Math.round(Math.random() * 90 - 45);
  newSeed();
}

PALETTES.forEach((hex) => {
  const b = document.createElement("button");
  b.className = "swatch"; b.style.background = hex; b.title = hex; b.setAttribute("aria-label", "Accent " + hex);
  b.onclick = () => { $("accent").value = hex; schedule(); };
  $("swatches").appendChild(b);
});

const params = new URLSearchParams(location.hash.slice(1));
for (const [k, v] of params) {
  if (k === "res") $("res").value = v;
  else if (k === "w" || k === "h" || ctrlIds.includes(k)) $(k).value = v;
}
if (!params.has("seed")) $("seed").value = Math.floor(Math.random() * 1e9);
$("customRes").hidden = $("res").value !== "custom";

document.querySelectorAll("input, select").forEach((el) => el.addEventListener("input", () => {
  $("customRes").hidden = $("res").value !== "custom";
  schedule();
}));
$("reseed").onclick = newSeed;
$("shuffle").onclick = shuffle;
$("exportSpan").onclick = () => exportPNG(false);
$("exportEach").onclick = () => exportPNG(true);
addEventListener("resize", schedule);
addEventListener("keydown", (e) => {
  if (e.target.matches("input[type=number], select")) return;
  if (e.code === "Space") { e.preventDefault(); newSeed(); }
  if (e.key === "s" || e.key === "S") shuffle();
});
window.StudioOverlay?.mount($("overlayPanel"), {
  onChange: schedule,
  getPreview: () => ({ canvas: preview, settings: readSettings(), layout: layout(readSettings()) }),
});
numberFields(document.querySelector("aside"));
drawPreview();
// Canvas text drawn before the web font finishes loading uses the fallback; redraw once it has.
document.fonts?.ready.then(schedule);
</script>
</body>
</html>
